<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>City Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    * {margin:0;padding:0;box-sizing:border-box;}
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(-45deg,#0D1B2A,#1E3A5F,#2C5364,#0F2027);
      background-size:600% 600%;
      animation:bgShift 18s ease infinite;
      color:white;padding:30px;
    }
    @keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .home-icon{margin-bottom:20px;}
    .home-icon a {
      text-decoration:none;font-size:20px;color:#ffc107;
      padding:6px 12px;background:rgba(255,193,7,0.1);
      border-radius:8px;display:inline-block;
      transition:0.3s;
    }
    .home-icon a:hover{background:rgba(255,193,7,0.2);}
    .heading{text-align:center;margin-bottom:30px;}
    .heading h2{
      font-size:42px;color:#F1F1F1;
      text-shadow: 0 0 1px #fff,
    0 0 2px rgb(216, 223, 215),
    0 0 4px rgb(216, 223, 215),
    0 0 8px rgb(216, 223, 215);
    }
    .dashboard-box {
      max-width: 800px;
      margin: 0 auto;
      background: linear-gradient(to bottom,#0468b9,#01376d);
      border-radius:12px;
      padding:30px;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
    }
    .metric {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:15px 10px;
      background: #033f7d;
      border-radius:8px;
      margin-bottom:12px;
    }
    .metric-label{font-size:18px;color:#e0e0e0;}
    .metric-value{font-size:22px;color:#00e5ff;font-weight:600;}
    @media screen and (max-width:600px){
      .metric{flex-direction:column;text-align:center;}
      .metric-value{margin-top:8px;}
    }


  </style>
</head>
<body>

  <div class="home-icon">
    <a href="index.html">🏠 Home</a>
  </div>

  <div class="heading">
    <h2>CITY PROGRESS DASHBOARD</h2>
  </div>

  <div class="dashboard-box">
    <div class="metric">
      <div class="metric-label">Air Quality Index (Delhi)</div>
      <div class="metric-value" id="aqi">Loading…</div>
    </div>
    <div class="metric">
      <div class="metric-label">Smart Street Lights Deployed</div>
      <div class="metric-value">12,450</div>
    </div>
    <div class="metric">
      <div class="metric-label">Public EV Charging Stations</div>
      <div class="metric-value">320</div>
    </div>
    <div class="metric">
      <div class="metric-label">Solar Streetlight Coverage</div>
      <div class="metric-value">45%</div>
    </div>
    <div class="metric">
      <div class="metric-label">Digital Payments Adoption</div>
      <div class="metric-value">78%</div>
    </div>
  </div>

  <script>
    async function fetchAQI() {
  try {
    const resp = await fetch('https://api.openaq.org/v2/measurements?city=Delhi&limit=1');
    const json = await resp.json();
    const pm25 = json.results[0].value;
    document.getElementById('aqi').textContent = pm25 + ' µg/m³';
  } catch (e) {
    console.error('AQI fetch failed', e);
    document.getElementById('aqi').textContent = '—';
  }
}

    window.onload = fetchAQI;
  </script>

</body>
</html>
